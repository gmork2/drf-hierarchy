[project]
name = "drf-hierarchy"
version = "0.1.0"
description = "Django REST framework app for hierarchical group permission inheritance."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Django>=4.2,<5.0",
    "django-mptt>=0.12,<0.13",
    "djangorestframework>=3.15,<3.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
