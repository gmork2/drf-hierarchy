[project]
name = "drf-hierarchy"
version = "0.1.0"
description = "Django REST framework app for hierarchical group permission inheritance."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Django>=4.2,<7.0",
    "django-mptt>=0.16,<1.0",
    "djangorestframework>=3.15,<3.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["hierarchy"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sample.settings"
python_files = ["tests.py", "test_*.py"]
